[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pack-manager"
version = "0.1.0"
description = "Outbound pack verification agent (CUBE Buildathon Track 03)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pack-manager-demo = "pack_manager.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
